<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" fill="none">
  <defs>
    <linearGradient id="aiPipeBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="aiPipeOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="aiPipeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Dark Cybernetic Container -->
  <rect x="0" y="0" width="900" height="380" rx="20" fill="#0B1C2D" stroke="#1E3A5F" stroke-width="1.5" />

  <!-- Data Flow Connection Lines with Pulsing Pulses -->
  <path d="M 220 190 L 360 190" stroke="#1E3A5F" stroke-width="3" stroke-dasharray="6 6" />
  <path d="M 220 190 L 360 190" stroke="url(#aiPipeBlue)" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 120" />

  <path d="M 520 190 L 660 190" stroke="#1E3A5F" stroke-width="3" stroke-dasharray="6 6" />
  <path d="M 520 190 L 660 190" stroke="url(#aiPipeGreen)" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 120" />

  <!-- Node 1: Inbound Customer Signal -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="160" height="160" rx="16" fill="#0F2438" stroke="#1E3A5F" />
    <circle cx="80" cy="50" r="24" fill="#0288D1" fill-opacity="0.15" />
    <circle cx="80" cy="50" r="16" fill="#0288D1" />
    <path d="M 74 50 L 78 54 L 86 46" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="80" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1. Inbound Inquirer</text>
    <text x="80" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Website / Ads / Search</text>
    <rect x="20" y="126" width="120" height="20" rx="4" fill="#1E3A5F" />
    <text x="80" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8">Intent: Ortho Consult</text>
  </g>

  <!-- Node 2: DIGEGAIN AI Neural Classifier (Center Engine) -->
  <g transform="translate(360, 80)">
    <rect x="0" y="0" width="170" height="220" rx="20" fill="#102A43" stroke="#0288D1" stroke-width="2" filter="url(#aiGlow)" />
    
    <!-- Mini Rotating Swirl Logo -->
    <g transform="translate(65, 24) scale(0.4)">
      <path d="M 28 35 C 32 23, 44 15, 60 15 C 69 15, 76 19, 78 23 C 76 26, 68 25, 58 26 C 46 27, 36 31, 28 35 Z" fill="#FBB03B" />
      <path d="M 22 47 C 23 35, 36 27, 54 26 C 68 25, 80 30, 84 37 C 85 41, 82 43, 77 43 C 69 42, 58 35, 46 36 C 34 37, 26 43, 22 47 Z" fill="#F57C00" />
      <path d="M 24 61 C 26 51, 38 45, 56 45 C 72 45, 84 50, 88 57 C 89 62, 85 64, 79 65 C 69 64, 55 56, 44 56 C 33 56, 26 62, 24 61 Z" fill="#38BDF8" />
      <path d="M 31 72 C 36 64, 50 63, 66 64 C 78 65, 86 70, 86 74 C 84 77, 78 78, 69 77 C 57 76, 45 71, 37 73 C 33 74, 30 73, 31 72 Z" fill="#4CAF50" />
      <path d="M 42 81 C 51 77, 65 78, 77 83 C 73 86, 63 87, 53 86 C 45 85, 41 83, 42 81 Z" fill="#22C55E" />
    </g>

    <text x="85" y="86" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#38BDF8">DIGEGAIN AI ENGINE</text>
    <text x="85" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Sub-second Triage &amp; Match</text>

    <!-- AI Metric Indicators -->
    <rect x="15" y="116" width="140" height="24" rx="6" fill="#0B1C2D" />
    <text x="25" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Confidence Score:</text>
    <text x="145" y="132" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#34D399">99.4%</text>

    <rect x="15" y="146" width="140" height="24" rx="6" fill="#0B1C2D" />
    <text x="25" y="162" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Slot Availability:</text>
    <text x="145" y="162" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#38BDF8">4:30 PM</text>

    <rect x="15" y="176" width="140" height="26" rx="6" fill="#0288D1" />
    <text x="85" y="193" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Auto-Triage Active</text>
  </g>

  <!-- Node 3: Instant Dispatch & Revenue Conversion -->
  <g transform="translate(660, 110)">
    <rect x="0" y="0" width="180" height="160" rx="16" fill="#0F2438" stroke="#16A34A" />
    <circle cx="90" cy="50" r="24" fill="#16A34A" fill-opacity="0.15" />
    <circle cx="90" cy="50" r="16" fill="#22C55E" />
    <path d="M 84 50 L 88 54 L 96 46" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="90" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3. Automated Revenue</text>
    <text x="90" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#86EFAC">WhatsApp Token Sent in 2s</text>
    <rect x="15" y="126" width="150" height="20" rx="4" fill="#064E3B" />
    <text x="90" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#6EE7B7">Calendar &amp; CRM Synced</text>
  </g>
</svg>
