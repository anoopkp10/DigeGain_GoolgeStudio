      <circle cx="32" cy="131" r="14" fill="#FEF3C7" />
      <text x="28" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#D97706">AK</text>
      <text x="54" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1E293B">Ananya Kurian</text>
      <text x="54" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B">WhatsApp Token #29</text>
      <circle cx="178" cy="124" r="3" fill="#0288D1" />

