<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <!-- Background and Glow Gradients -->
    <radialGradient id="hGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1E89C1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1E89C1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#F37B20" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F37B20" stop-opacity="0" />
    </radialGradient>
    
    <!-- Linear Gradients for UI elements -->
    <linearGradient id="hCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="hChartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0288D1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0288D1" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="hBadgeOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F2438" flood-opacity="0.12" />
    </filter>
    <filter id="hFloatingShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F2438" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="180" fill="url(#hGlow1)" />
  <circle cx="650" cy="380" r="160" fill="url(#hGlow2)" />

