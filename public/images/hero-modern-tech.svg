    <rect x="74" y="114" width="12" height="12" rx="2" fill="#FFFFFF" opacity="0.9" />

    <rect x="68" y="148" width="24" height="24" rx="6" fill="#E2E8F0" />
    <circle cx="80" cy="160" r="5" fill="#94A3B8" />

    <rect x="68" y="188" width="24" height="24" rx="6" fill="#E2E8F0" />
    <rect x="75" y="195" width="10" height="10" rx="1" fill="#94A3B8" />

    <rect x="68" y="228" width="24" height="24" rx="6" fill="#E2E8F0" />
    <line x1="74" y1="240" x2="86" y2="240" stroke="#94A3B8" stroke-width="2" />

