    <rect x="50" y="40" width="700" height="420" rx="20" fill="url(#hCardBg)" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Browser Chrome Header Bar -->
    <rect x="50" y="40" width="700" height="48" rx="20" fill="#FFFFFF" />
    <path d="M 50 68 H 750" stroke="#F1F5F9" stroke-width="1" />
    
    <!-- Window Control Dots -->
    <circle cx="80" cy="64" r="5" fill="#EF4444" />
    <circle cx="96" cy="64" r="5" fill="#F59E0B" />
    <circle cx="112" cy="64" r="5" fill="#10B981" />

    <!-- Omnibar URL Pill -->
