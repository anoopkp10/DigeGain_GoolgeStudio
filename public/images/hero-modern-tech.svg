      <circle cx="32" cy="193" r="14" fill="#DCFCE7" />
      <text x="28" y="197" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803D">MS</text>
      <text x="54" y="186" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1E293B">Mohammed Salih</text>
      <text x="54" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B">Cart ₹18,500 · Paid UPI</text>
      <circle cx="178" cy="186" r="3" fill="#10B981" />
    </g>
  </g>

  <!-- Floating Badge 1: Ultra Speed Gauge (Top Right) -->
  <g transform="translate(620, 20)" filter="url(#hFloatingShadow)">
    <rect x="0" y="0" width="160" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="28" cy="32" r="16" fill="#ECFDF5" />
    <path d="M 23 32 L 27 36 L 34 27" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="52" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748B">Core Web Vitals</text>
    <text x="52" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#0F172A">0.8s <tspan font-size="11" font-weight="700" fill="#10B981">100/100</tspan></text>
