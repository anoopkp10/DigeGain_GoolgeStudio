      <path d="M 28 35 C 32 23, 44 15, 60 15 C 69 15, 76 19, 78 23 C 76 26, 68 25, 58 26 C 46 27, 36 31, 28 35 Z" fill="#FBB03B" />
      <path d="M 22 47 C 23 35, 36 27, 54 26 C 68 25, 80 30, 84 37 C 85 41, 82 43, 77 43 C 69 42, 58 35, 46 36 C 34 37, 26 43, 22 47 Z" fill="#F57C00" />
      <path d="M 24 61 C 26 51, 38 45, 56 45 C 72 45, 84 50, 88 57 C 89 62, 85 64, 79 65 C 69 64, 55 56, 44 56 C 33 56, 26 62, 24 61 Z" fill="#38BDF8" />
      <path d="M 31 72 C 36 64, 50 63, 66 64 C 78 65, 86 70, 86 74 C 84 77, 78 78, 69 77 C 57 76, 45 71, 37 73 C 33 74, 30 73, 31 72 Z" fill="#4CAF50" />
      <path d="M 42 81 C 51 77, 65 78, 77 83 C 73 86, 63 87, 53 86 C 45 85, 41 83, 42 81 Z" fill="#22C55E" />
    </g>

    <text x="64" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1">DIGEGAIN ENGINE</text>
    <text x="64" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Zero Missed Leads</text>
    <text x="64" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Automated WhatsApp + Email Alert</text>
