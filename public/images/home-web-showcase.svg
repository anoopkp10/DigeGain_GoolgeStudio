<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <defs>
    <radialGradient id="showcaseGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0288D1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0288D1" stop-opacity="0" />
    </radialGradient>
    <filter id="scShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0B1E30" flood-opacity="0.16" />
    </filter>
    <linearGradient id="scScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2438" />
      <stop offset="100%" stop-color="#1B3B5A" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="450" cy="240" r="300" fill="url(#showcaseGlow)" />

  <!-- Device 1: Laptop Screen (Backbone Center) -->
  <g transform="translate(180, 50)" filter="url(#scShadow)">
    <!-- Laptop Lid -->
    <rect x="0" y="0" width="540" height="340" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" />
    <!-- Screen Bezel -->
    <rect x="12" y="12" width="516" height="316" rx="8" fill="#FFFFFF" />

    <!-- Screen Header -->
    <rect x="12" y="12" width="516" height="32" fill="#F8FAFC" />
    <circle cx="28" cy="28" r="4" fill="#EF4444" />
    <circle cx="40" cy="28" r="4" fill="#F59E0B" />
    <circle cx="52" cy="28" r="4" fill="#10B981" />
    <rect x="76" y="20" width="220" height="16" rx="4" fill="#E2E8F0" />
    <text x="86" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">app.carewell.digegain.com</text>

    <!-- Clinic Portal Hero Inside Laptop -->
    <rect x="28" y="58" width="484" height="90" rx="8" fill="#F0F9FF" stroke="#E0F2FE" />
    <text x="44" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0369A1">Carewell Orthopedic &amp; Rehab</text>
    <text x="44" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Book Consultation in 30 Seconds · Automated SMS &amp; WhatsApp Token</text>
    <rect x="44" y="118" width="130" height="22" rx="6" fill="#0288D1" />
    <text x="56" y="133" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Select Department →</text>

    <!-- 3 Clinic Doctor Cards Inside Laptop -->
    <!-- Doctor Card 1 -->
    <g transform="translate(28, 160)">
      <rect x="0" y="0" width="150" height="152" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="34" cy="34" r="18" fill="#BAE6FD" />
      <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0369A1">PM</text>
      <text x="14" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">Dr. Pradeep M.</text>
      <text x="14" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748B">Cardiology · MD</text>
      <rect x="14" y="98" width="55" height="16" rx="4" fill="#ECFDF5" />
      <text x="20" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#15803D">4 Slots Left</text>
      <rect x="14" y="122" width="122" height="20" rx="4" fill="#0288D1" />
      <text x="42" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Book Token</text>
    </g>

    <!-- Doctor Card 2 -->
    <g transform="translate(195, 160)">
      <rect x="0" y="0" width="150" height="152" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="34" cy="34" r="18" fill="#FED7AA" />
      <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#C2410C">SM</text>
      <text x="14" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">Dr. Shabnam K.</text>
      <text x="14" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748B">Dermatology · DVD</text>
      <rect x="14" y="98" width="55" height="16" rx="4" fill="#ECFDF5" />
      <text x="20" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#15803D">2 Slots Left</text>
      <rect x="14" y="122" width="122" height="20" rx="4" fill="#0288D1" />
      <text x="42" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Book Token</text>
    </g>

    <!-- Doctor Card 3 -->
    <g transform="translate(362, 160)">
      <rect x="0" y="0" width="150" height="152" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="34" cy="34" r="18" fill="#BBF7D0" />
      <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#15803D">AR</text>
      <text x="14" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">Dr. Alex Roy</text>
      <text x="14" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748B">Pediatrics · DCH</text>
      <rect x="14" y="98" width="60" height="16" rx="4" fill="#FEF3C7" />
      <text x="20" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#B45309">Waitlist Only</text>
      <rect x="14" y="122" width="122" height="20" rx="4" fill="#64748B" />
      <text x="36" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Join Waitlist</text>
    </g>

    <!-- Laptop Base -->
    <path d="M -40 340 L 580 340 L 550 354 L -10 354 Z" fill="#94A3B8" />
    <rect x="230" y="340" width="80" height="6" rx="3" fill="#64748B" />
  </g>

  <!-- Device 2: Mobile Phone (Foreground Overlap Left) -->
  <g transform="translate(60, 160)" filter="url(#scShadow)">
    <rect x="0" y="0" width="180" height="320" rx="28" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <!-- Dynamic Island / Notch -->
    <rect x="60" y="10" width="60" height="14" rx="7" fill="#000000" />
    
    <!-- Phone Screen Body -->
    <rect x="8" y="28" width="164" height="280" rx="20" fill="#FFFFFF" />

    <!-- Mobile WhatsApp Notification Card -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="144" height="54" rx="10" fill="#F0FDF4" stroke="#BBF7D0" />
      <circle cx="16" cy="18" r="8" fill="#22C55E" />
      <path d="M 12 18 L 15 21 L 20 15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <text x="30" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#15803D">Carewell Clinic</text>
      <text x="10" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#334155">Appointment Confirmed!</text>
      <text x="10" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0288D1">Token #14 · 4:30 PM Today</text>
    </g>

    <!-- Mobile Quick Action Buttons -->
    <g transform="translate(18, 106)">
      <rect x="0" y="0" width="144" height="36" rx="8" fill="#0288D1" />
      <text x="16" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Get Directions (Maps)</text>
    </g>
    <g transform="translate(18, 150)">
      <rect x="0" y="0" width="144" height="36" rx="8" fill="#F37B20" />
      <text x="24" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Pay Consultation ₹500</text>
    </g>

    <!-- Live Status Chip on Phone -->
    <rect x="18" y="200" width="144" height="88" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="28" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0F172A">Clinic Real-Time Status</text>
    <circle cx="32" cy="236" r="4" fill="#22C55E" />
    <text x="42" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#15803D">Doctor is in Room 4</text>
    <text x="28" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B">Current token in queue: #11</text>
    <text x="28" y="272" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#D97706">Your turn in approx 20 mins</text>
  </g>

  <!-- Device 3: Tablet (Foreground Overlap Right) -->
  <g transform="translate(670, 150)" filter="url(#scShadow)">
    <rect x="0" y="0" width="200" height="310" rx="20" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <rect x="10" y="10" width="180" height="290" rx="12" fill="#0F2438" />

    <!-- Dark Salon & E-commerce System on Tablet -->
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38BDF8">AURUM SALON</text>
    <text x="24" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Today's Stylist Calendar</text>

    <!-- Stylist 1 Slot -->
    <rect x="20" y="66" width="160" height="48" rx="8" fill="#1E3A5F" />
    <text x="30" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Master Hair Spa</text>
    <text x="30" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#7DD3FC">3:00 PM · Shabnam K. (Booked)</text>

    <!-- Stylist 2 Slot -->
    <rect x="20" y="122" width="160" height="48" rx="8" fill="#1E3A5F" />
    <text x="30" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Bridal Package Trial</text>
    <text x="30" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#FDBA74">5:30 PM · Advance ₹5,000 Paid</text>

    <!-- Live Revenue Counter -->
    <rect x="20" y="180" width="160" height="60" rx="8" fill="#0B1E30" stroke="#1E3A5F" />
    <text x="30" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#94A3B8">Today's Digital Bookings</text>
    <text x="30" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#34D399">₹42,800</text>
    <text x="120" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#38BDF8">24 Orders</text>

    <!-- Tablet Home Indicator -->
    <rect x="70" y="284" width="60" height="3" rx="1.5" fill="#475569" />
  </g>
</svg>
